[project]
name = "sarthi"
version = "0.1.0"
description = "Open-source, self-hosted AI agent that finds, matches and applies to jobs for you."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.12"
dependencies = [
    "ats-scrapers>=0.4,<0.5",
    "defusedxml>=0.7.1",
    "playwright>=1.48",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=6.1",
    "python-jobspy>=1.4.1,<1.5",
    "telethon>=1.36",
    "typer>=0.12",
    "typst>=0.15,<0.16",
]

[project.scripts]
sarthi = "sarthi.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest-asyncio>=0.24",
    "pandas-stubs>=3.1.0.261029",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarthi"]

# ---------- Lint + format ----------
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "N",             # naming
    "UP",            # modern syntax
    "B",             # likely bugs
    "S",             # security (bandit rules)
    "A",             # shadowing builtins
    "C4", "SIM", "RET", "PIE",
    "PTH",           # pathlib over os.path
    "PL",            # pylint
    "D",             # docstrings
    "RUF",
    "T20",           # no print()
    "ERA",           # no commented-out code
    "BLE",           # no blind except
    "TRY",           # exception best practices
    "DTZ",           # timezone-aware datetimes
]
ignore = ["D203", "D213", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S101", "S311", "D", "PLR2004", "A005", "RUF001", "PLR0913", "PLR0917"]
# Upstream data tables and regexes kept verbatim (long lines) so future syncs with StillOpen stay easy.
"src/sarthi/jobs/{geo,countries,forms}.py" = ["E501", "RUF001"]
"src/sarthi/answers/questions.py" = ["E501"]
"src/sarthi/tracking/{triage,matcher}.py" = ["E501"]
"src/sarthi/sources/posts.py" = ["E501", "RUF001"]
# Messages to people use typographic dashes and emoji on purpose.
"src/sarthi/chat/**" = ["RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------- Types ----------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

# ---------- Tests ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not live\" --cov=sarthi --cov-report=term-missing --cov-fail-under=80"
markers = ["live: hits real external services (skipped by default, run with -m live)"]
asyncio_mode = "auto"
filterwarnings = ["error::ResourceWarning"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["sarthi"]

# ---------- Architecture rules (docs/ARCHITECTURE.md §6) ----------
[tool.importlinter]
root_package = "sarthi"

[[tool.importlinter.contracts]]
name = "Pipeline steps never import each other (they talk through db + queue)"
type = "independence"
modules = [
    "sarthi.sources", "sarthi.matching", "sarthi.documents", "sarthi.answers",
    "sarthi.apply", "sarthi.tracking", "sarthi.chat",
]

[[tool.importlinter.contracts]]
name = "Layers only import downwards"
type = "layers"
layers = [
    "sarthi.cli",
    "sarthi.app",
    "sarthi.sources | sarthi.matching | sarthi.documents | sarthi.answers | sarthi.apply | sarthi.tracking | sarthi.chat",
    "sarthi.queue | sarthi.ai",
    "sarthi.profile",
    "sarthi.db",
    "sarthi.jobs",
    "sarthi.clock | sarthi.config | sarthi.log",
]
